services:
  moneylog-web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: moneylog-web

    ports:
      - "127.0.0.1:3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000

    restart: unless-stopped